buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.0'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        // RootEncoder (RTSP push) is published on JitPack.
        maven { url 'https://jitpack.io' }
    }
}
